name: Build Douyin Liquid Glass

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/gradle-wrapper.properties
            **/*.gradle
            **/*.gradle.kts
            **/gradle.properties
            **/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            || { echo '--- retry after license accept ---'; yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"; }
          echo '--- installed packages ---'
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Validate project structure
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14