name: Build Douyin Liquid Glass

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo '--- installed platforms ---'
          ls "$ANDROID_HOME/platforms"
          echo '--- installed build-tools ---'
          ls "$ANDROID_HOME/build-tools"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Validate project structure
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14